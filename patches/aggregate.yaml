# Memweave 聚合层声明（声明式清单，不是默认安装补丁）。
#
# 设计说明（重要）：
#   DSH 0.2.x 的 bundle patch 只有 insert / override / disabled 等行语义，
#   **没有 `optional: true`**。因此本文件不能直接作为可安装 patch 交给 Loader：
#   未安装的包会变成 failed fiber，而不是被静默跳过。
#
# 本文件是“希望聚合哪些插件”的单一事实来源。真正的可安装聚合由
#   node scripts/prepare-aggregate.mjs
# 读取本文件，检查本机已安装的包，只把可用行写入
#   aggregate/cordis.patch.yml
# 从而得到“缺失即跳过”的等价效果。聚合包只声明组合，不修改被聚合插件的
# 配置、运行时或工具。
#
# 默认 bundle 安装不读取本文件。
- insert:
    - id: memweave
      name: dsh-memweave
    - id: memweave-compat-memory-xfy
      name: dsh-memory-xfy
      optional: true
    - id: memweave-compat-task-memory
      name: dsh-task-memory
      optional: true
